apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: acit3495
data:
  init.sql: "CREATE TABLE IF NOT EXISTS users (\n  id INT AUTO_INCREMENT PRIMARY KEY,\n\
    \  username VARCHAR(50) NOT NULL UNIQUE,\n  password_hash VARCHAR(255) NOT NULL\n\
    );\nCREATE TABLE IF NOT EXISTS readings (\n  id INT AUTO_INCREMENT PRIMARY KEY,\n\
    \  value DOUBLE NOT NULL,\n  created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,\n\
    \  INDEX idx_created_at (created_at)\n);\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init
  namespace: acit3495
data:
  init-app-users.sh: '#!/bin/sh

    set -eu

    APP_PASS="$(cat /run/secrets/mongo_app_password)"

    READER_PASS="$(cat /run/secrets/mongo_reader_password)"

    # Runs only when the Mongo data volume is first initialized, on localhost.

    mongosh --quiet --host 127.0.0.1 <<EOF

    const analytics = db.getSiblingDB(''analytics'');

    analytics.createUser({user: ''analytics_app'', pwd: ''${APP_PASS}'', roles: [{role:
    ''readWrite'', db: ''analytics''}]});

    analytics.createUser({user: ''analytics_reader'', pwd: ''${READER_PASS}'', roles:
    [{role: ''read'', db: ''analytics''}]});

    EOF

    '
