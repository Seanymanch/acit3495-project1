# deploy.py substitutes __OWNER__ and __TAG__ at apply time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: acit3495
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: ghcr.io/__OWNER__/acit3495-auth:__TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - {name: MYSQL_HOST, value: mysql}
            - {name: MYSQL_USER, value: temperature_app}
            - {name: MYSQL_DATABASE, value: temperatures}
            - {name: APP_USERNAME, value: student}
          volumeMounts:
            - {name: app-secrets, mountPath: /run/secrets, readOnly: true}
          startupProbe:
            httpGet: {path: /live, port: 8000}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /live, port: 8000}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1000m, memory: 384Mi}
      volumes:
        - name: app-secrets
          secret:
            secretName: acit3495-secrets
            items:
              - {key: mysql_password, path: mysql_password}
              - {key: jwt_secret, path: jwt_secret}
              - {key: demo_password, path: demo_password}
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: acit3495
spec:
  type: ClusterIP
  selector: {app: auth}
  ports:
    - {port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
