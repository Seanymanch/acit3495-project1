apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: acit3495
spec:
  clusterIP: None
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
  selector:
    app: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: acit3495
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: temperatures
            - name: MYSQL_USER
              value: temperature_app
            - name: MYSQL_PASSWORD_FILE
              value: /run/secrets/mysql_password
            - name: MYSQL_ROOT_PASSWORD_FILE
              value: /run/secrets/mysql_root_password
          volumeMounts:
            - name: db
              mountPath: /var/lib/mysql
            - name: app-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-init.sql
              subPath: init.sql
              readOnly: true
          startupProbe:
            exec:
              command: [sh, -c, "mysqladmin ping --host=127.0.0.1 --silent"]
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            exec:
              command: [sh, -c, "mysqladmin ping --host=127.0.0.1 --silent"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, "mysqladmin ping --host=127.0.0.1 --silent"]
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1500Mi
      volumes:
        - name: init
          configMap:
            name: mysql-init
        - name: app-secrets
          secret:
            secretName: acit3495-secrets
            items:
              - key: mysql_password
                path: mysql_password
              - key: mysql_root_password
                path: mysql_root_password
  volumeClaimTemplates:
    - metadata:
        name: db
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: acit3495-gp3
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: acit3495
spec:
  clusterIP: None
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
  selector:
    app: mongo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: acit3495
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: mongo
          image: mongo:7.0
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: admin
            - name: MONGO_INITDB_ROOT_PASSWORD_FILE
              value: /run/secrets/mongo_root_password
          volumeMounts:
            - name: db
              mountPath: /data/db
            - name: app-secrets
              mountPath: /run/secrets
              readOnly: true
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-create-users.sh
              subPath: init-app-users.sh
              readOnly: true
          startupProbe:
            exec:
              command: [mongosh, --quiet, --eval, "db.adminCommand({ping:1}).ok"]
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 36
          readinessProbe:
            exec:
              command: [mongosh, --quiet, --eval, "db.adminCommand({ping:1}).ok"]
            periodSeconds: 10
            timeoutSeconds: 6
          livenessProbe:
            exec:
              command: [mongosh, --quiet, --eval, "db.adminCommand({ping:1}).ok"]
            periodSeconds: 30
            timeoutSeconds: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1500Mi
      volumes:
        - name: init
          configMap:
            name: mongo-init
            defaultMode: 0555
        - name: app-secrets
          secret:
            secretName: acit3495-secrets
            items:
              - key: mongo_root_password
                path: mongo_root_password
              - key: mongo_app_password
                path: mongo_app_password
              - key: mongo_reader_password
                path: mongo_reader_password
  volumeClaimTemplates:
    - metadata:
        name: db
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: acit3495-gp3
        resources:
          requests:
            storage: 8Gi
