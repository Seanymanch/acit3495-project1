# Estimate charges before creating: EKS control plane, EC2, EBS and LBs cost money.
# Change region/name/instance type if needed. Avoid running this next to another cluster.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: acit3495-p2
  region: us-west-2
iam:
  withOIDC: true
managedNodeGroups:
  - name: project2-workers
    instanceType: t3.medium
    desiredCapacity: 3
    minSize: 3
    maxSize: 3
    volumeSize: 40
    privateNetworking: false
addonsConfig:
  autoApplyPodIdentityAssociations: true
addons:
  - name: metrics-server
  - name: aws-ebs-csi-driver
